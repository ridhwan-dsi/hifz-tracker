<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hifz — fine-tuning snapped boxes &amp; lines (mock)</title>
<style>
:root{--bg:#0d1210;--card:#17201c;--line:#2a3631;--ink:#e9f1ec;--muted:#93a99c;--acc:#4cbf8a;--blue:#1d6fe0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:19px;margin:4px 0 4px}p.sub{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 6px;border-radius:12px;border:0;background:var(--card);color:var(--muted);font-weight:700;font-size:13.5px;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button.on{background:var(--muted);color:var(--card);box-shadow:none}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:inset 0 0 0 1px var(--line)}
.card h2{font-size:15.5px;margin:2px 0 4px}.card .why{color:var(--muted);font-size:13px;margin:0 0 10px}
.pg{position:relative;border-radius:10px;overflow:hidden;background:#fff;touch-action:none}
.pg img{display:block;width:100%}
.pg svg{position:absolute;inset:0;width:100%;height:100%}
.grid line{stroke:#e0262c;stroke-width:1;stroke-dasharray:4 4;opacity:.55;vector-effect:non-scaling-stroke}
.vg{stroke:var(--blue);stroke-width:1.4;stroke-dasharray:5 5;vector-effect:non-scaling-stroke;opacity:.75}
.div{stroke:#e0662c;stroke-width:2.4;fill:none;vector-effect:non-scaling-stroke}
.div.sel{stroke:var(--blue)}
.tab{fill:var(--blue)}
.tabarrow{stroke:#fff;stroke-width:1.6;fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:10px;border-radius:12px;background:#111816;box-shadow:inset 0 0 0 1px var(--line)}
.row .lbl{color:var(--muted);font-size:12.5px;font-weight:700;margin-right:2px}
.ov{display:flex;align-items:center;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.ov button{border:0;background:transparent;color:var(--ink);width:38px;height:34px;font-size:17px}
.ov span{min-width:52px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.mag{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:0;background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:13px}
.mag.on{background:var(--muted);color:var(--card);box-shadow:none}
.mag svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.sw{display:flex;gap:4px}.sw button{padding:6px 10px;border-radius:99px;border:0;background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:12.5px}
.sw button.on{background:var(--muted);color:var(--card);box-shadow:none}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.pros{margin:10px 0 0;padding:0 0 0 18px;font-size:13px;color:var(--muted)}.pros b{color:var(--ink)}
.rec{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--acc);color:#06140d;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:8px 2px 0}.legend i{display:inline-block;width:16px;border-top:1.5px dashed #e0262c;vertical-align:4px;margin-right:4px}
</style></head><body><main>

<script>
var YS=[26.9,79.6,132.4,185.1,237.9,290.6], PITCH=52.75, REACH=9;
var T='a', box, ln, sel='box', drag=null, mag=true, extra={t:0,b:0}, gm=0;
function reset(){box={x:300,y:YS[1],w:120,h:PITCH,et:0,eb:0};ln={x:200,y1:YS[3],y2:YS[4],off1:0,off2:0};}
reset();
var TX={
 a:{t:'A · Edge tabs on the box, nudge arrows on the line',rec:1,
    w:'The box keeps snapping as now. Two small tabs sit on its top and bottom edges: drag a tab to stretch that edge a little past its line (up to half a line). For a line, ▲ ▼ buttons in the Line row nudge the selected end a little.',
    p:['<b>Per box, exactly where needed</b> — one box can reach up for a shadda, the next stays tight','Snapping still does the hard work; the tab is only for the odd case','Uses the same hold-and-drag as the width guides']},
 b:{t:'B · Magnet switch in the Box and Line rows',
    w:'A magnet icon in each row turns snapping on or off. Off: boxes and lines go exactly where you drop them, free as before v147.',
    p:['<b>Simplest</b> — one icon, no new gestures','But with the magnet off you lose the neat alignment for everything until you turn it back on','Box height stays one line; you still can’t make a box taller without unlocking height in Settings']},
 c:{t:'C · Extra margin in Settings (all pages)',
    w:'Settings → Boxes: “Extra above” and “Extra below” add the same small margin to every snapped box on every page. Lines get an “offset” the same way.',
    p:['<b>Set once</b>, applies everywhere','But it is the same for every box — a margin big enough for a tall tashkil makes every other box look loose','Doesn’t help a single awkward spot']}
};
function near(y){var b=y,d=REACH;YS.forEach(function(v){var q=Math.abs(v-y);if(q<d){d=q;b=v;}});return b;}
function snapMid(top,h){var mid=top+h/2,d=REACH,b=null;for(var i=0;i<YS.length-1;i++){var c=(YS[i]+YS[i+1])/2,q=Math.abs(c-mid);if(q<d){d=q;b=c;}}return b==null?top:b-h/2;}
function boxRect(){var et=box.et,eb=box.eb;if(T==='c'){et=extra.t*PITCH/100;eb=extra.b*PITCH/100;}if(T!=='a'){et=T==='c'?et:0;eb=T==='c'?eb:0;}return{x:box.x,y:box.y-et,w:box.w,h:box.h+et+eb};}
function lineYs(){var o=T==='c'?gm*PITCH/100:0;return[ln.y1+(T==='a'?ln.off1:0)+o,ln.y2+(T==='a'?ln.off2:0)+o];}
function draw(){
 var s='<g class="grid">'+YS.map(function(y){return'<line x1="0" x2="560" y1="'+y+'" y2="'+y+'"/>';}).join('')+'</g>';
 var r=boxRect();
 s+='<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="3" fill="#3a8f5f" fill-opacity=".28" stroke="'+(sel==='box'?'#1d6fe0':'none')+'" stroke-width="1.5" stroke-dasharray="6 4" style="vector-effect:non-scaling-stroke"/>';
 var L=lineYs();
 s+='<polyline class="div'+(sel==='line'?' sel':'')+'" points="560,'+L[0]+' '+ln.x+','+L[0]+' '+ln.x+','+L[1]+' 0,'+L[1]+'"/>';
 if(sel==='box'){s+='<line class="vg" x1="'+r.x+'" x2="'+r.x+'" y1="0" y2="315"/><line class="vg" x1="'+(r.x+r.w)+'" x2="'+(r.x+r.w)+'" y1="0" y2="315"/>';
  if(T==='a'){var cx=r.x+r.w/2;[[r.y,-1],[r.y+r.h,1]].forEach(function(q){s+='<rect class="tab" x="'+(cx-16)+'" y="'+(q[0]-6)+'" width="32" height="12" rx="6"/><path class="tabarrow" d="M'+(cx-5)+' '+(q[0]-q[1]*2)+'l5 '+(q[1]*4)+' 5 '+(-q[1]*4)+'"/>';});}}
 else s+='<line class="vg" x1="'+ln.x+'" x2="'+ln.x+'" y1="0" y2="315"/>';
 document.getElementById('ov').innerHTML=s;
}
function ctl(){
 var h='';
 if(T==='a'){
  h='<div class="row"><span class="lbl">Box</span><span class="note" style="margin:0">Drag the blue tabs on the box’s top/bottom edge'+(box.et||box.eb?' · <a href="#" id="rs" style="color:#4cbf8a">Snap back</a>':'')+'</span></div>'+
    '<div class="row"><span class="lbl">Line</span><div class="sw"><button data-e="1" class="'+(ln.e!==2?'on':'')+'">Right end</button><button data-e="2" class="'+(ln.e===2?'on':'')+'">Left end</button></div><div class="ov"><button data-n="-1">▲</button><span>'+fmt(ln.e===2?ln.off2:ln.off1)+'</span><button data-n="1">▼</button></div></div>';
 } else if(T==='b'){
  var ic='<svg viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3M6 7h4M14 7h4"/></svg>';
  h='<div class="row"><span class="lbl">Box</span><button class="mag'+(mag?' on':'')+'" id="mg">'+ic+(mag?'Snap on':'Snap off')+'</button><span class="note" style="margin:0">Same switch in the Line row</span></div>';
 } else {
  h='<div class="row" style="display:block"><div class="lbl" style="margin-bottom:6px">Settings → Boxes &amp; lines</div>'+
   rowS('Extra above','t',extra.t)+rowS('Extra below','b',extra.b)+rowS('Line offset','g',gm)+'</div>';
 }
 document.getElementById('ctl').innerHTML=h;
}
function fmt(v){var p=Math.round(v/PITCH*100);return(p>0?'+':'')+p+'%';}
function rowS(l,k,v){return'<div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0"><span style="font-size:13px">'+l+'</span><div class="ov"><button data-s="'+k+'" data-d="-5">−</button><span>'+(v>0&&k==='g'?'+':'')+v+'%</span><button data-s="'+k+'" data-d="5">+</button></div></div>';}
function render(){var x=TX[T];document.getElementById('ttl').innerHTML=x.t+(x.rec?'<span class="rec">SUGGESTED</span>':'');document.getElementById('why').textContent=x.w;document.getElementById('pros').innerHTML=x.p.map(function(q){return'<li>'+q+'</li>';}).join('');ctl();draw();}
document.querySelector('.tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;T=b.dataset.t;document.querySelectorAll('.tabs button').forEach(function(q){q.classList.toggle('on',q===b);});render();};
document.getElementById('ctl').onclick=function(e){
 var t=e.target.closest('[data-n],[data-e],[data-s],#mg,#rs');if(!t)return;e.preventDefault();
 if(t.id==='mg')mag=!mag;
 else if(t.id==='rs'){box.et=box.eb=0;}
 else if(t.dataset.e){ln.e=+t.dataset.e;sel='line';}
 else if(t.dataset.n){var k=ln.e===2?'off2':'off1';ln[k]=Math.max(-PITCH*.4,Math.min(PITCH*.4,ln[k]+(+t.dataset.n)*PITCH*.04));sel='line';}
 else if(t.dataset.s){var k2=t.dataset.s,d=+t.dataset.d;if(k2==='g')gm=Math.max(-30,Math.min(30,gm+d));else extra[k2]=Math.max(0,Math.min(40,extra[k2]+d));}
 render();
};
function P(e){var r=document.getElementById('pg').getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*560,y:(e.clientY-r.top)/r.height*315};}
var pg=document.getElementById('pg');
pg.onpointerdown=function(e){
 var p=P(e),r=boxRect();pg.setPointerCapture(e.pointerId);
 if(T==='a'&&sel==='box'&&Math.abs(p.x-(r.x+r.w/2))<26){if(Math.abs(p.y-r.y)<10){drag={k:'et',y0:p.y,o:box.et};return;}if(Math.abs(p.y-(r.y+r.h))<10){drag={k:'eb',y0:p.y,o:box.eb};return;}}
 if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h){sel='box';drag={k:'box',p:p,o:{x:box.x,y:box.y}};draw();ctl();return;}
 var L=lineYs(),onL=(p.x>ln.x?Math.abs(p.y-L[0]):Math.abs(p.y-L[1]))<12||(Math.abs(p.x-ln.x)<10&&p.y>Math.min(L[0],L[1])-8&&p.y<Math.max(L[0],L[1])+8);
 if(onL){sel='line';drag={k:p.x>ln.x?'y1':'y2'};ln.e=p.x>ln.x?1:2;draw();ctl();return;}
};
pg.onpointermove=function(e){if(!drag)return;var p=P(e),snap=!(T==='b'&&!mag);
 if(drag.k==='box'){box.x=drag.o.x+p.x-drag.p.x;var ny=drag.o.y+p.y-drag.p.y;box.y=snap?snapMid(ny,box.h):ny;}
 else if(drag.k==='et')box.et=Math.max(0,Math.min(PITCH*.5,drag.o-(p.y-drag.y0)));
 else if(drag.k==='eb')box.eb=Math.max(0,Math.min(PITCH*.5,drag.o+(p.y-drag.y0)));
 else if(drag.k==='y1')ln.y1=snap?near(p.y):p.y; else if(drag.k==='y2')ln.y2=snap?near(p.y):p.y;
 draw();};
pg.onpointerup=pg.onpointercancel=function(){drag=null;ctl();};
render();
</script></body></html>
